version = 1

# REUSE 3.3 toplu annotation
# https://reuse.software/spec-3.3/
#
# Suderra OS scaffold kodu için varsayılan: Apache-2.0
# Yapılandırma dosyaları (yml, json, vb.) için: CC0-1.0 (kreatif olmayan, salt-fonksiyonel)

[[annotations]]
path = [
    "**/*.md",
    "**/*.sh",
    "**/*.mk",
    "**/Makefile",
    "**/Config.in",
    "**/Dockerfile",
    "**/*.service",
    "**/*.conf",
    "**/*.config",
    "**/*.cfg",
    "external.desc",
    "external.mk",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Suderra OS Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "**/*.yml",
    "**/*.yaml",
    "**/*.json",
    "**/*.toml",
    ".editorconfig",
    ".gitignore",
    ".markdownlint-cli2.yaml",
    ".yamllint.yml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Suderra OS Contributors"
SPDX-License-Identifier = "CC0-1.0"

# Defconfig'ler (Buildroot Kconfig formatı)
[[annotations]]
path = "configs/*_defconfig"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Suderra OS Contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Vendored Suderra edge contract (ADR-048 DEC-25): an exact copy of
# Okan-wqm/aquaculture_platform contracts/suderra-edge, pinned by digest. Its
# copyright and licence are those of the source repository (LICENSE there,
# reproduced as LICENSES/LicenseRef-AquaculturePlatform-Proprietary.txt), not
# the defaults above; a different grant for the vendored copy is the
# copyright holder's decision and changes this block, never the vendored files.
[[annotations]]
path = "contracts/suderra-edge/**"
precedence = "override"
SPDX-FileCopyrightText = "2024-2026 Aquaculture Platform"
SPDX-License-Identifier = "LicenseRef-AquaculturePlatform-Proprietary"

# The vendoring pin is Suderra OS's own functional record.
[[annotations]]
path = "contracts/suderra-edge.digest"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Suderra OS Contributors"
SPDX-License-Identifier = "CC0-1.0"
