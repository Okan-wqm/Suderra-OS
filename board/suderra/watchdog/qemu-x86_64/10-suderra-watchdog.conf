# PID1 owns the hardware watchdog of the QEMU x86_64 CI/dev board (ADR-048
# DEC-6.6, EI-033). Every harness runs -machine q35, whose ICH9 LPC bridge
# carries an iTCO watchdog; an explicit -device i6300esb is the other one the
# kernels carry. 60-suderra-watchdog.rules names either, /dev/suderra-watchdog.
#
# RuntimeWatchdogSec stays under the iTCO hardware maximum of the oldest TCO
# version, 0x3f ticks of 0.6 s = 37 s (drivers/watchdog/iTCO_wdt.c), and
# under the i6300ESB's 2046 s. The iTCO driver refuses to bind when the NO_REBOOT
# bit cannot be cleared, so the harness starts QEMU with
# -global ICH9-LPC.noreboot=false and -action watchdog=reset
# (tests/qemu/watchdog-reset-test.sh).
[Manager]
WatchdogDevice=/dev/suderra-watchdog
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
