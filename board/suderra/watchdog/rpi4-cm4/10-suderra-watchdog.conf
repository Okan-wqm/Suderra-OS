# PID1 owns the hardware watchdog of the Raspberry Pi 4 / CM4 (ADR-048 DEC-6.6,
# EI-033). The same BCM2711 PM watchdog and the same limits as the RevPi
# Connect 4's (see that board's drop-in): the board has no other watchdog, but
# it is still named by its identity, so every board has one mechanism and the
# health gate reads one link.
#
# RuntimeWatchdogSec stays under the BCM2835 hardware maximum of 15.999 s
# (drivers/watchdog/bcm2835_wdt.c).
[Manager]
WatchdogDevice=/dev/suderra-watchdog
RuntimeWatchdogSec=10s
RebootWatchdogSec=2min
