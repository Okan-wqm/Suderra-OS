# PID1 owns the hardware watchdog of the RevPi Connect 4 (ADR-048 DEC-6.6,
# EI-033). Nothing else opens it: suderra-watchdog is gone and the agent unit
# may not name /dev/watchdog (contracts unit-directives.json).
#
# The board has two watchdogs, the BCM2711 PM watchdog and the PCF2129 RTC's
# (the overlay's rtc@51 carries reset-source), and their /dev/watchdogN numbers
# follow probe order. 60-suderra-watchdog.rules names the BCM2711 one,
# /dev/suderra-watchdog; systemd opens a configured path exactly and retries it
# on every ping, so it arms as soon as udev has created the link
# (systemd 256.17 src/shared/watchdog.c).
#
# RuntimeWatchdogSec stays under the BCM2835 hardware maximum, 0xfffff ticks
# of 1/65536 s = 15.999 s (drivers/watchdog/bcm2835_wdt.c): PID1 pings at least
# every half of it. RebootWatchdogSec guards the part of a reboot after PID1 is
# replaced by systemd-shutdown. Whether this watchdog resets the carrier board
# or only the SoC, and so whether the PCF2129's is the better owner, is
# verified on hardware (docs/operations/watchdog.md).
[Manager]
WatchdogDevice=/dev/suderra-watchdog
RuntimeWatchdogSec=10s
RebootWatchdogSec=2min
