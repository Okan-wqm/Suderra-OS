# PID1 owns the hardware watchdog of an industrial x86 PC (ADR-048 DEC-6.6,
# EI-033). This is the model-independent base: the chipset's iTCO watchdog
# (needs I2C_I801/LPC_ICH and a BIOS that leaves NO_REBOOT clear). A model with
# another timer (a Super I/O or EC watchdog) gets its own x86-ipc-<model> board
# at qualification (docs/operations/watchdog.md), with its identity in its rule.
#
# RuntimeWatchdogSec stays under the iTCO hardware maximum of the oldest TCO
# version, 0x3f ticks of 0.6 s = 37 s (drivers/watchdog/iTCO_wdt.c).
[Manager]
WatchdogDevice=/dev/suderra-watchdog
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
