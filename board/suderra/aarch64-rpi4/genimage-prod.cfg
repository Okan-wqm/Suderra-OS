# Suderra OS — Raspberry Pi 4 / CM4 PRODUCTION disk layout (ADR-0007)
#
# GPT A/B + dm-verity + LUKS2 /data. Yalnız PROD variant post-image tarafından
# seçilir (dev build MBR aarch64-rpi4/genimage.cfg kullanmaya devam eder — bkz.
# board/suderra/common/post-image.sh). GPT partlabel'ları RAUC'un
# by-partlabel slot tanımlarıyla eşleşir (package/suderra-rauc-config).
#
# Boot zinciri (ADR-0007, ADR-048 DEC-18):
#   Pi firmware (start4.elf) -> config.txt (kernel=u-boot.bin) + the keyed
#   device tree of the board -> U-Boot: its compiled-in bootcmd picks the slot
#   from the raw environment and boots the signed suderra-<slot>.fit
#     -> dm-verity rootfs (RO) -> systemd
#
# Boot partition (GPT #1, ESP-tipi FAT): Pi firmware + u-boot.bin + config.txt
# + suderra-A/B.fit + the board device trees. The device trees are the keyed
# copies of build step firmware-dtb (scripts/production-artifacts.sh): the Pi
# firmware hands U-Boot the tree it loads, that tree is U-Boot's control FDT,
# and the FIT verification key is in it. There is no u-boot.dtb (nothing loads
# it) and no boot.scr (an unsigned script on a writable FAT; the slot choice is
# compiled into U-Boot). Image/cmdline.txt YOK (kernel+bootargs imzalı FIT içinde).
#
# U-Boot's environment is two raw copies in the gap in front of the first
# partition (board/suderra/aarch64-rpi4/uboot-fragment.config: offsets 0x60000
# and 0x80000, 0x4000 each; package/suderra-rauc-config/fw_env.config names the
# same). The boot partition therefore starts at 1 MiB, past both copies and past
# the GPT entries at gpt-location. tests/image-contracts/
# uboot-env-contract-test.sh compares all three.

image boot.vfat {
  vfat {
    label = "SUDRBOOT"
    files = {
      "u-boot.bin",
      "suderra-A.fit",
      "suderra-B.fit",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup4.dat",
      "rpi-firmware/start4.elf"
    }
    file bcm2711-rpi-4-b.dtb {
      image = "firmware-dtb/bcm2711-rpi-4-b.dtb"
    }
    file bcm2711-rpi-cm4.dtb {
      image = "firmware-dtb/bcm2711-rpi-cm4.dtb"
    }
    file bcm2711-rpi-cm4-io.dtb {
      image = "firmware-dtb/bcm2711-rpi-cm4-io.dtb"
    }
    file overlays {
      image = "rpi-firmware/overlays"
    }
  }
  size = 256M
}

image suderra-rpi4-target.img {
  hdimage {
    partition-table-type = "gpt"
    gpt-location = 32K
  }

  partition boot {
    partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
    bootable = "true"
    offset = 1M
    image = "boot.vfat"
  }

  partition rootfs-a {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    image = "rootfs.ext4"
    size = 512M
  }

  partition rootfs-a-verity {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    image = "rootfs.verity"
    size = 64M
  }

  partition rootfs-b {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    # İlk imajda B slot boş — RAUC ilk update'te doldurur
    size = 512M
  }

  partition rootfs-b-verity {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    # İlk imajda B verity slot boş — RAUC ilk update'te doldurur
    size = 64M
  }

  partition data {
    partition-type-uuid = "dfd38caa-c384-51a7-8a94-2446996318c5"
    # /data has a GPT type of its own: systemd-repart matches partitions to
    # repart.d/50-data.conf by type alone and grows this one to fill the disk
    # (ADR-048 DEC-24; usr/lib/repart.d/50-data.conf in the rootfs overlay).
    # İlk boot'ta suderra-data-unlock bunu LUKS2 olarak provision eder ve anahtarı
    # TPM2'ye seal eder (PCR7-bound, fail-closed: TPM yoksa provision edilmez).
    # Boş/formatsız sevk edilir; düz ext4 olarak ASLA sevk edilmez (RT-1).
    size = 2G
  }
}
