# Suderra OS - boot description of the Revolution Pi Connect 4.
#
# Read by scripts/production-artifacts.sh (arm-board-dtb, arm-pre-genimage) and
# by tests/image-contracts/revpi-board-contract-test.sh. Plain KEY=VALUE lines,
# sourced by the shell; a value is one word or a double-quoted word list. A
# board directory without this file is a board whose FIT is built from the stock
# kernel trees (aarch64-rpi4).
#
# Why a device-tree build step at all: in production U-Boot hands the kernel the
# device tree of the signed FIT, not the one the Pi firmware built from
# config.txt, so a config.txt dtoverlay= or dtparam= never reaches the kernel
# (EI-024, EI-029). The Connect 4's board nodes (PiBridge, UART5 RS485, SPI1 TPM,
# I2C1 RTC and GPIO expanders, 15 status LEDs) come from KUNBUS's
# revpi-connect4 overlay, merged here into the CM4 tree with fdtoverlay and
# built into the FIT (and, for the dev image, loaded by the firmware through
# config.txt device_tree=). One merged file, one place.

# The stock tree and the KUNBUS overlay built by the pinned kernel
# (BR2_LINUX_KERNEL_INTREE_DTS_NAME, BR2_LINUX_KERNEL_INTREE_DTSO_NAMES; the
# kernel is built with DTC_FLAGS=-@ for fdtoverlay,
# BR2_LINUX_KERNEL_DTB_OVERLAY_SUPPORT). Both are looked up in BINARIES_DIR.
BOARD_BASE_DTB=bcm2711-rpi-cm4.dtb
BOARD_DT_OVERLAYS="revpi-connect4.dtbo"

# The merged tree, named in BINARIES_DIR, and the compatible its root must carry
# (the overlay sets it; the build fails if it does not, and the same string is
# the FIT configuration's compatible in the template).
BOARD_FINAL_DTB=bcm2711-revpi-connect4.dtb
BOARD_COMPATIBLE=kunbus,revpi-connect4

# The FIT template of one slot, and the nodes the merged tree must enable. The
# gate (production-artifacts.sh) checks them on the tree it extracts from the
# built FIT, i.e. on the tree U-Boot hands the kernel.
BOARD_FIT_ITS=revpi-connect4.its
BOARD_DT_REQUIRED=dt-required.txt

# Kernel console of the FIT's bootargs: serial0 of the merged tree is the mini
# UART (ttyS0), the Connect 4's debug UART. ttyAMA0 is the PL011 whose pins the
# overlay gives to other functions, so a console there prints nowhere.
BOARD_CONSOLE=ttyS0,115200
