# Suderra OS — Revolution Pi Connect 4 target image layout (dev)
#
# RevPi Connect 4 is treated as a separate target. USB-A self-install is
# supported where firmware boot order allows it; micro-USB/rpiboot remains the
# official fallback for eMMC flashing.
#
# The dev image has no initramfs, so the kernel resolves its root by itself:
# cmdline.txt names the root as root=PARTUUID=<disk-signature>-02 (the kernel
# understands PARTUUID=, not LABEL=; EI-022), and the signature below is what
# makes that name exist. Partition 2 is rootfs.
#
# The firmware loads bcm2711-revpi-connect4.dtb (config.txt device_tree=), the
# board's final device tree; the stock CM4 trees and the firmware's overlays
# directory are not shipped.

image boot.vfat {
  vfat {
    label = "SUDRBOOT"
    files = {
      "bcm2711-revpi-connect4.dtb",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup4.dat",
      "rpi-firmware/start4.elf",
      "Image"
    }
  }
  size = 256M
}

image data.ext4 {
  ext4 {
    label = "SUDERRA-DATA"
  }
  size = 512M
}

image suderra-revpi4-target.img {
  hdimage {
    partition-table-type = "mbr"
    disk-signature = 0x5d3e0a11
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}
