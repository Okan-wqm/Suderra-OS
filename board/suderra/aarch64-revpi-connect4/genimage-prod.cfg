# Suderra OS — Revolution Pi Connect 4 PRODUCTION disk layout (ADR-0007)
#
# GPT A/B + dm-verity + LUKS2 /data. Only the PROD variant is selected by
# post-image (the dev build keeps the MBR layout of
# aarch64-revpi-connect4/genimage.cfg).
# RevPi Connect 4 is BCM2711/CM4 based; its boot chain is the one of rpi4
# (U-Boot + signed FIT). What differs is the device tree: the kernel boots the
# FIT's bcm2711-revpi-connect4.dtb (the CM4 tree with the revpi-connect4
# overlay merged at build time, board-boot.conf), so the boot partition carries
# no overlays directory and no CM4 IO board tree. bcm2711-rpi-cm4.dtb stays
# because the firmware loads it for U-Boot's own use. /data LUKS2 is sealed to
# the SPI TPM2 (SLB9670) of the Connect 4.

image boot.vfat {
  vfat {
    label = "SUDRBOOT"
    files = {
      "u-boot.bin",
      "u-boot.dtb",
      "boot.scr",
      "suderra-A.fit",
      "suderra-B.fit",
      "bcm2711-rpi-cm4.dtb",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup4.dat",
      "rpi-firmware/start4.elf"
    }
  }
  size = 256M
}

image suderra-revpi4-target.img {
  hdimage {
    partition-table-type = "gpt"
    gpt-location = 32K
  }

  partition boot {
    partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs-a {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    image = "rootfs.ext4"
    size = 512M
  }

  partition rootfs-a-verity {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    image = "rootfs.verity"
    size = 64M
  }

  partition rootfs-b {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    size = 512M
  }

  partition rootfs-b-verity {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    size = 64M
  }

  partition data {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    # İlk boot'ta suderra-data-unlock LUKS2 provision + TPM2-seal eder (RevPi
    # Connect 4 SPI TPM2/SLB9670, PCR7-bound). Boş sevk edilir; düz ext4 SEVK
    # EDİLMEZ (RT-1).
    size = 2G
  }
}
