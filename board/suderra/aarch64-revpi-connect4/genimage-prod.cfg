# Suderra OS — Revolution Pi Connect 4 PRODUCTION disk layout (ADR-0007)
#
# GPT A/B + dm-verity + LUKS2 /data. Only the PROD variant is selected by
# post-image (the dev build keeps the MBR layout of
# aarch64-revpi-connect4/genimage.cfg).
# RevPi Connect 4 is BCM2711/CM4 based; its boot chain is the one of rpi4
# (U-Boot + signed FIT, see aarch64-rpi4/genimage-prod.cfg for the chain, the
# raw U-Boot environment in front of the first partition and the keyed device
# tree). What differs is the device tree the kernel gets: the FIT's
# bcm2711-revpi-connect4.dtb (the CM4 tree with the revpi-connect4 overlay
# merged at build time, board-boot.conf), so the boot partition carries no
# overlays directory and no CM4 IO board tree. The firmware loads
# bcm2711-rpi-cm4.dtb for U-Boot's own use; it is the keyed copy
# (firmware-dtb/), U-Boot's control FDT. /data LUKS2 is sealed to the SPI TPM2
# (SLB9670) of the Connect 4.

image boot.vfat {
  vfat {
    label = "SUDRBOOT"
    files = {
      "u-boot.bin",
      "suderra-A.fit",
      "suderra-B.fit",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup4.dat",
      "rpi-firmware/start4.elf"
    }
    file bcm2711-rpi-cm4.dtb {
      image = "firmware-dtb/bcm2711-rpi-cm4.dtb"
    }
  }
  size = 256M
}

image suderra-revpi4-target.img {
  hdimage {
    partition-table-type = "gpt"
    gpt-location = 32K
  }

  partition boot {
    partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
    bootable = "true"
    offset = 1M
    image = "boot.vfat"
  }

  partition rootfs-a {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    image = "rootfs.ext4"
    size = 512M
  }

  partition rootfs-a-verity {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    image = "rootfs.verity"
    size = 64M
  }

  partition rootfs-b {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    size = 512M
  }

  partition rootfs-b-verity {
    partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
    size = 64M
  }

  partition data {
    partition-type-uuid = "dfd38caa-c384-51a7-8a94-2446996318c5"
    # /data has a GPT type of its own: systemd-repart matches partitions to
    # repart.d/50-data.conf by type alone and grows this one to fill the disk
    # (ADR-048 DEC-24; usr/lib/repart.d/50-data.conf in the rootfs overlay).
    # İlk boot'ta suderra-data-unlock LUKS2 provision + TPM2-seal eder (RevPi
    # Connect 4 SPI TPM2/SLB9670, PCR7-bound). Boş sevk edilir; düz ext4 SEVK
    # EDİLMEZ (RT-1).
    size = 2G
  }
}
