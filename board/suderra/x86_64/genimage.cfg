# Suderra OS — x86_64 disk image layout (genimage)
#
# Faz 1'de detaylanır. A/B partition + /data layout.
#
# Çağrı: scripts/post-image.sh içinden

image disk.img {
    hdimage {
        partition-table-type = "gpt"
        gpt-location = 32K
    }

    partition efi {
        partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
        partition-uuid = "9cb29941-f12f-4091-90d7-7aa4166334d6"
        bootable = "true"
        image = "efi-part.vfat"
        size = 64M
    }

    partition rootfs-a {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        partition-uuid = "37d3370c-cc02-4521-afaa-108aa6f329cb"
        image = "rootfs.ext4"
        size = 512M
    }

    partition rootfs-a-verity {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        partition-uuid = "7a862dda-5e26-4bca-9a10-e949c69c9f84"
        image = "rootfs.verity"
        size = 64M
    }

    partition rootfs-b {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        partition-uuid = "b05f6f48-ffcd-4d11-88ee-34d3d8534440"
        # İlk imajda B slot boş — RAUC ilk update'te doldurur
        size = 512M
    }

    partition rootfs-b-verity {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        partition-uuid = "27b61609-9316-47d2-9a0e-7cff8aeed180"
        # İlk imajda B verity slot boş — RAUC ilk update'te doldurur
        size = 64M
    }

    partition data {
        partition-type-uuid = "dfd38caa-c384-51a7-8a94-2446996318c5"
        partition-uuid = "53309d52-6911-466f-b25b-468be30e79f1"
        # /data has a GPT type of its own: systemd-repart matches partitions to
        # repart.d/50-data.conf by type alone and grows this one to fill the disk
        # (ADR-048 DEC-24; usr/lib/repart.d/50-data.conf in the rootfs overlay).
        # Production runtime provisions this as LUKS2 and unlocks it through
        # TPM2/swtpm. It must not ship as a plain ext4 filesystem.
        size = 2G
    }
}

# EFI bölümünün içeriği
image efi-part.vfat {
    vfat {
        file EFI {
            image = "efi-part/EFI"
        }
    }
    size = 64M
}
