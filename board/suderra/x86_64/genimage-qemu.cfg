# Suderra OS — QEMU x86_64 disk image layout
#
# Production'dan (A/B + LUKS2 /data) farklı olarak QEMU dev imajında TEK
# rootfs ve düz ext4 /data vardır (ADR-048 DEC-8 kart matrisi, DEC-12):
# suderra-data-unlock dev imajında /data'yı SUDERRA-DATA etiketli ext4
# bölümünden bağlar; bölüm yoksa data-unlock alarmı yazar ve yaşam döngüsü
# LOCKED okunur.
#
# Çağrı: post-image.sh içinden (BR2_ROOTFS_POST_SCRIPT_ARGS=suderra_qemu_x86_64)

# EFI partition içeriği — Buildroot GRUB2 EFI çıktısını doğrudan kullanır.
image efi-part.vfat {
    vfat {
        file EFI {
            image = "efi-part/EFI"
        }

        file bzImage {
            image = "bzImage"
        }
    }
    size = 32M
}

# /data: an empty ext4 filesystem labelled SUDERRA-DATA. "empty = true" is
# required: without it genimage fills a filesystem image with the whole
# --rootpath (the target rootfs).
image data.ext4 {
    empty = true
    ext4 {
        label = "SUDERRA-DATA"
        use-mke2fs = true
    }
    size = 512M
}

image disk.img {
    hdimage {
        partition-table-type = "gpt"
        gpt-location = 32K
    }

    partition efi {
        partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
        bootable = "true"
        image = "efi-part.vfat"
        size = 32M
    }

    partition rootfs {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "rootfs.ext4"
        size = 256M
    }

    partition data {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "data.ext4"
    }
}
