# Suderra OS - GPT partition UUIDs of the production disk layouts (ADR-048 DEC-18.1).
#
# <partition name> <PARTUUID>. The name is the genimage partition section (the
# GPT partition label too). One file is the source of every place that names a
# partition of the production disk:
#   - the genimage-prod configs give the partition this UUID (partition-uuid);
#   - the verity initramfs finds the root and hash partitions by it, from the
#     signed kernel command line (suderra.verity.root_partuuid / hash_partuuid);
#   - RAUC's slots, the boot mount and /data are named by it: post-build.sh
#     replaces @SUDERRA_PARTUUID_<NAME>@ in those files (scripts/ci/gpt-partuuids.py).
# A partition label or file-system label is whatever a removable disk says it is;
# the PARTUUID is what the build wrote on the boot disk, and the initramfs refuses
# to continue when a second disk carries the same one.
#
# The values were generated once (uuid4) and never change: a change is a different
# disk layout, which an installed device's A/B update cannot make. Lowercase,
# one per line, no comments after a value. tests/image-contracts/gpt-partuuid-contract-test.sh
# holds every consumer to this file.
