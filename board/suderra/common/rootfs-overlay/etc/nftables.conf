#!/usr/sbin/nft -f
#
# Suderra OS — appliance firewall (ADR-048 DEC-11)
#
# The default ruleset: `suderra-installer policy apply` loads it in every
# lifecycle state except PROVISIONING and reprovisioning MAINTENANCE, and
# whenever the lifecycle reads LOCKED. No inbound service is open.
#
# IPv6 is disabled by sysctl (etc/sysctl.d/90-suderra-hardening.conf), so no
# ICMPv6/ND rule is needed; any IPv6 packet meets the drop policy.
#

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept

        # DHCPv4 replies (offers may be broadcast, so conntrack cannot match them).
        udp sport 67 udp dport 68 accept

        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # The device is not a router.
    }

    chain output {
        type filter hook output priority filter; policy drop;

        oif "lo" accept
        ct state established,related accept

        # DHCPv4 discover, request and unicast renewal.
        udp sport 68 udp dport 67 accept

        # ACCEPTED EXPOSURE until per-UID egress (P1) and the signed site OT
        # allowlist (P2): these ports are open towards any address (EI-059).
        udp dport 53 accept
        tcp dport 53 accept
        udp dport 123 accept
        # NTS key establishment (chrony, DEC-7).
        tcp dport 4460 accept
        tcp dport 443 accept
        tcp dport 8883 accept
        tcp dport 502 accept
        tcp dport 4840 accept

        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
    }
}
