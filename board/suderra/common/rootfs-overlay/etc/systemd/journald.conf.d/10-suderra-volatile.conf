# The journal is volatile (ADR-048 DEC-4.9, DEC-24): the root is read-only and
# /etc/machine-id is transient, so /var/log/journal/<machine-id> would be
# neither writable nor stable. Persistent evidence is the agent's audit log on
# /data and the typed install and update results (DEC-27).
[Journal]
Storage=volatile
RuntimeMaxUse=32M
