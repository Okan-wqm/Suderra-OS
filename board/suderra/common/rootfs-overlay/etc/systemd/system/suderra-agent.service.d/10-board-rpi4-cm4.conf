# Board device access of suderra-agent.service on rpi4-cm4
# (ADR-048 DEC-1.8; contracts/suderra-edge/v1/unit-directives.json
# board_dropins). post-build.sh installs only the drop-in of the image's
# board_profile. Node ownership: 60-suderra-devices.rules.
[Service]
DeviceAllow=/dev/gpiomem rw
DeviceAllow=/dev/i2c-1 rw
DeviceAllow=/dev/spidev0.0 rw
DeviceAllow=/dev/spidev0.1 rw
DeviceAllow=/dev/ttyAMA0 rw
SupplementaryGroups=dialout gpio i2c spi
