# Board device access of suderra-agent.service on qemu-x86_64
# (ADR-048 DEC-1.8; contracts/suderra-edge/v1/unit-directives.json
# board_dropins). post-build.sh installs only the drop-in of the image's
# board_profile. Node ownership: 60-suderra-devices.rules.
[Service]
DeviceAllow=char-ttyACM rw
DeviceAllow=char-ttyS rw
DeviceAllow=char-ttyUSB rw
SupplementaryGroups=dialout
RestrictAddressFamilies=AF_CAN
