# dropbear is the provisioning SSH surface only (ADR-048 DEC-5.1, DEC-5.3).
# It runs only inside the open provisioning window and stops with it; the
# host key lives on /data (/etc/dropbear is bound from /data/suderra/os/ssh)
# and is created by suderra-provision-mode, which shows its fingerprint with
# the one-time password, so dropbear never generates keys itself (no -R)
# and the image's /var/run symlink workaround is not needed.
[Unit]
ConditionPathExists=/run/suderra-os/provisioning-open
BindsTo=suderra-provision-mode.service
After=suderra-provision-mode.service nftables.service

[Service]
ExecStartPre=
ExecStart=
ExecStart=/usr/sbin/dropbear -F $DROPBEAR_ARGS
