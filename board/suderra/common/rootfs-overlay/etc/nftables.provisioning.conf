#!/usr/sbin/nft -f
#
# Suderra OS — provisioning firewall (ADR-048 DEC-5.4, DEC-11.3, DEC-11.9)
#
# Loaded only while the root-owned lifecycle is PROVISIONING or
# reprovisioning MAINTENANCE. `suderra-installer policy apply` prepends
#     define provision_iface = "<interface carrying the default route>"
# (a validated interface name) and refuses this file unless SSH is scoped to
# $provision_iface. New SSH connections are rate-limited per source address,
# so one host on the LAN cannot lock the technician out. Everything else is
# the appliance ruleset.
#

flush ruleset

table inet filter {
    set provision_ssh_sources {
        type ipv4_addr
        flags dynamic, timeout
        timeout 10m
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept

        udp sport 67 udp dport 68 accept

        # Provisioning SSH: the default-route interface only, per-source meter.
        iifname $provision_iface tcp dport 22 ct state new update @provision_ssh_sources { ip saddr limit rate 6/minute burst 3 packets } accept

        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        oif "lo" accept
        ct state established,related accept

        udp sport 68 udp dport 67 accept

        # NTP and NTS key establishment: chronyd only (see nftables.conf).
        meta skuid "chrony" udp dport 123 accept
        meta skuid "chrony" tcp dport 4460 accept

        udp dport 53 accept
        tcp dport 53 accept
        tcp dport 443 accept
        tcp dport 8883 accept
        tcp dport 502 accept
        tcp dport 4840 accept

        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
    }
}
