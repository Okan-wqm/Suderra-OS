# Suderra OS time source (ADR-048 DEC-7.1; EI-046, EI-052).
#
# The image's clock comes from NTS-authenticated servers and from nowhere else.
# This file is read-only in the verity root (DEC-4.1); chronyd's state lives on
# /data, bound at /var/lib/chrony (DEC-4.2). tests/image-contracts/
# time-sync-contract-test.sh holds every line below to the rules it states.
#
# Sources. Pinned by host name: NTS verifies the server's certificate for the
# name given here, so a name is the pin and an address would not be. The
# firewall opens two ports to the chrony user, tcp/4460 for NTS-KE and udp/123
# for NTP (DEC-7.7, DEC-11.4):
#   ptbtime1.ptb.de, ptbtime4.ptb.de  Physikalisch-Technische Bundesanstalt,
#       Braunschweig and Berlin (https://zeit.ptb.de/files/ptb-ntp-services.json:
#       ntske.tcpport 4460, ntp.udpPort 123, TLS 1.3, Let's Encrypt)
#   time.cloudflare.com  Cloudflare (NTS-KE default port 4460,
#       https://github.com/cloudflare/cfnts). Cloudflare's pages do not state
#       the NTP port the server names during NTS-KE. If it is not udp/123 the
#       firewall refuses that source and the two PTB servers carry the clock;
#       hardware bring-up (HIL) is where this is observed.
# A server that negotiates another NTP port during NTS-KE (Netnod's NTS servers
# answer on udp/4123) would be refused by the firewall, so none is listed.
# `minsources` stays at its default of 1: a site that reaches only its own NTS
# server (a signed site policy adds it, DEC-7.1) must still synchronize.
server ptbtime1.ptb.de iburst nts
server ptbtime4.ptb.de iburst nts
server time.cloudflare.com iburst nts

# Only authenticated sources are ever selected: a source without nts or key
# gets chrony's noselect option. The one exception DEC-7.1 allows, a plain NTP
# server a signed site policy marks explicitly, needs this mode lowered (mix
# lets it join only while it agrees with the NTS sources, ignore lets it
# synchronize alone) and a source line; the typed site renderer that writes
# both from the policy (DEC-11.7, phase P2) does not exist yet, so no plain
# source can be selected on this image today.
authselectmode require

# The clock is stepped only by the first clock update after chronyd starts
# (the clock before it is the time floor, DEC-7.2, so the first update may be
# far off), and slewed ever after. A later update larger than 1000 s is
# ignored, without limit (-1): giving up and exiting would make the next start
# a first update again, and a first update steps. `suderra-time-state` reports
# a clock the source disagrees with as unsynced, so an ignored offset is never
# trusted silently.
makestep 1.0 1
maxchange 1000 1 -1

# The root distance beyond which a source is unusable, and beyond which
# `suderra-time-state` calls the clock unsynced (its MAX_ROOT_DISTANCE_MS is
# this value; the contract test compares them). chrony's default, stated so
# the two cannot drift apart.
maxdistance 3.0

# Let the kernel copy the system time to the RTC every 11 minutes, which needs
# an RTC driver with CONFIG_RTC_SYSTOHC (DEC-7.8: PCF2129 on the RevPi
# Connect 4, PCF85063A on the CM4 IO board, the CMOS clock on x86). A board
# without an RTC has nothing to copy to and this line does nothing there.
rtcsync

# State on /data: the frequency drift, and the NTS cookies, so a restart or a
# reboot needs no new NTS-KE (and no certificate check against a clock that has
# not synchronized yet).
driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony

# Log every adjustment of more than a second, so a step is in the journal.
logchange 1.0

# This device is a client: no NTP server port, and chronyc only over the Unix
# socket in /run/chrony, which root and the chrony user can open.
port 0
cmdport 0
