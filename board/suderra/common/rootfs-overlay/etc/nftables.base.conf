#!/usr/sbin/nft -f
#
# Suderra OS — base drop ruleset (ADR-048 DEC-11.2)
#
# Loaded before anything else and left in force whenever the selected ruleset
# cannot load. It must load on every kernel with nf_tables at all, so it uses
# only base chains, interface matches and verdicts: no conntrack, limit, meter
# or set expressions. Nothing but loopback passes.
#

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;
        oif "lo" accept
    }
}
