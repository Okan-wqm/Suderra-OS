# Suderra OS - usbguard daemon configuration of the production images
# (ADR-048 DEC-18.2). Keys and defaults: usbguard-daemon.conf(5)
# https://man.archlinux.org/man/usbguard-daemon.conf.5
#
# The policy is /etc/usbguard/rules.conf on the read-only root: no rule is ever
# written by the daemon (no RuleFolder), so a change of the policy is a change of
# the image. A device nothing allows is blocked, at start for the devices that
# are present and afterwards for the ones that are inserted. Only root may talk
# to the daemon: the ingress unit, which authorizes a stick for the duration of
# one verified copy, is root.
RuleFile=/etc/usbguard/rules.conf
ImplicitPolicyTarget=block
PresentDevicePolicy=apply-policy
PresentControllerPolicy=keep
InsertedDevicePolicy=apply-policy
AuthorizedDefault=none
RestoreControllerDeviceState=false
DeviceManagerBackend=uevent
IPCAllowedUsers=root
IPCAllowedGroups=
DeviceRulesWithPort=false
# The root file system is read-only; the audit log is volatile, the events are in
# the journal too.
AuditBackend=FileAudit
AuditFilePath=/run/usbguard/usbguard-audit.log
HidePII=false
