# Suderra OS - USB device policy of the production images (ADR-048 DEC-18.2).
#
# The first rule that matches a device decides; a device no rule matches is
# blocked (ImplicitPolicyTarget=block in usbguard-daemon.conf). A running (ACTIVE)
# device has no USB storage: a stick is blocked however it is labelled, and so
# is any composite device that carries a storage interface next to another one.
# The provisioning or recovery bundle on a stick is read only while the device is
# in PROVISIONING or MAINTENANCE, by the root ingress unit, which authorizes that
# one device for the duration of the copy (usbguard allow-device without -p, so
# nothing is written here) and mounts it ro,nosuid,nodev,noexec in a private mount
# namespace; the content is accepted only after its signature verifies.
#
# Allowed: hubs, and the two kinds of USB device a field device uses: serial
# adapters (the RS485/RS232 fieldbus adapters of the agent) and HID. Every allow
# rule uses `equals`: the device's interfaces are exactly the listed ones. usbguard's
# `all-of` and `one-of` accept a device that has the listed interface PLUS others,
# which is how a keyboard that also carries a network or storage interface gets in
# (https://usbguard.github.io/documentation/rule-language.html). A vendor-specific
# serial chip is allowed by its vendor and product id together with its interface
# count and class, so a device that borrows the class is not one. A new adapter
# model is a new line below, reviewed with the hardware list;
# tests/image-contracts/usbguard-contract-test.sh holds this file to the policy
# and parses every rule with usbguard's own parser.

# Mass storage: never, whatever else the device offers.
block with-interface one-of { 08:*:* }

# Hubs: one hub interface.
allow with-interface equals { 09:*:* }

# Serial: CDC ACM, a control and a data interface.
allow with-interface equals { 02:02:* 0a:*:* }

# Serial: vendor-specific USB-UART bridges, by the chip's id and interfaces.
# FTDI FT232R, FT232H, FT231X: one interface; FT2232: two; FT4232: four.
allow id 0403:6001 with-interface equals { ff:*:* }
allow id 0403:6014 with-interface equals { ff:*:* }
allow id 0403:6015 with-interface equals { ff:*:* }
allow id 0403:6010 with-interface equals { ff:*:* ff:*:* }
allow id 0403:6011 with-interface equals { ff:*:* ff:*:* ff:*:* ff:*:* }
# Silicon Labs CP210x
allow id 10c4:ea60 with-interface equals { ff:*:* }
# WCH CH340/CH341
allow id 1a86:7523 with-interface equals { ff:*:* }
# Prolific PL2303
allow id 067b:2303 with-interface equals { ff:*:* }

# HID (an operator panel, a barcode reader): a device whose one or two
# interfaces are HID and nothing else.
allow with-interface equals { 03:*:* }
allow with-interface equals { 03:*:* 03:*:* }
