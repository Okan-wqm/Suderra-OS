# Suderra OS - the partitions of the production disk layouts and their GPT
# PARTUUIDs (ADR-048 DEC-18.1), as the image carries them: one "<name> <PARTUUID>"
# per line. post-build.sh replaces the placeholders from
# board/suderra/common/gpt-partuuids.conf (scripts/ci/gpt-partuuids.py), the one
# list the genimage layouts and the signed kernel command line use too, and fails
# the build if one is left. suderra-disk-layout reads this file: every partition
# of it that exists on the disk of the verified root gets a name under
# /run/suderra-os/disk, and a PARTUUID carried by two partitions, or by a
# partition of another disk, refuses the whole layout (disk-layout.sh). A layout
# has some of these (the Raspberry Pi boards a `boot` partition, x86 an `efi`
# one); tests/image-contracts/disk-layout-contract-test.sh holds this list to
# the genimage layouts.
boot @SUDERRA_PARTUUID_BOOT@
efi @SUDERRA_PARTUUID_EFI@
rootfs-a @SUDERRA_PARTUUID_ROOTFS_A@
rootfs-a-verity @SUDERRA_PARTUUID_ROOTFS_A_VERITY@
rootfs-b @SUDERRA_PARTUUID_ROOTFS_B@
rootfs-b-verity @SUDERRA_PARTUUID_ROOTFS_B_VERITY@
data @SUDERRA_PARTUUID_DATA@
