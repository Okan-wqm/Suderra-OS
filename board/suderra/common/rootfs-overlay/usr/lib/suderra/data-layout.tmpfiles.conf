# /data layout of Suderra OS (ADR-048 DEC-4.2, DEC-4.3, DEC-24;
# contracts/suderra-edge/v1/mutable-state.json, data_partition.layout_tmpfiles).
#
# suderra-data-unlock applies this file with `systemd-tmpfiles --create` right
# after it mounts /data and before it binds the trees onto their mountpoints.
# It is not under tmpfiles.d because systemd-tmpfiles-setup.service runs before
# /data is mounted. These lines are the only place that creates, chowns or
# chmods anything under /data/suderra/agent and /data/suderra/log, the trees
# the agent writes: root scripts never write there (symlink-race rule,
# DEC-4.3), and systemd-tmpfiles refuses unsafe path transitions.
# tests/image-contracts/single-owner-chown-contract-test.sh compares every line
# with the contract.
#
# Type Path                              Mode User     Group    Age
d      /data/suderra                      0755 root     root     -
d      /data/suderra/os                   0700 root     root     -
d      /data/suderra/os/installer         0700 root     root     -
d      /data/suderra/os/chrony            0750 chrony   chrony   -
d      /data/suderra/os/ssh               0700 root     root     -
d      /data/rauc                         0700 root     root     -
d      /data/suderra/site                 0750 root     suderra  -
d      /data/suderra/edge                 0755 root     root     -
d      /data/suderra/agent                0750 suderra  suderra  -
d      /data/suderra/agent/state          0750 suderra  suderra  -
d      /data/suderra/agent/secrets        0700 suderra  suderra  -
d      /data/suderra/agent/queue          0750 suderra  suderra  -
d      /data/suderra/agent/scripts        0750 suderra  suderra  -
d      /data/suderra/agent/policy-cache   0750 suderra  suderra  -
d      /data/suderra/agent/update-requests 0750 suderra suderra  -
d      /data/suderra/log                  0750 suderra  suderra  -
