# Grow /data to fill the disk on the first boot (ADR-048 DEC-24).
#
# The image ships a data partition of a fixed size, the flashed device is
# larger, and the encrypted /data should use all of it. systemd-repart runs
# before suderra-data.service (systemd-repart.service.d/10-suderra.conf), so
# the partition has its final size when suderra-data-unlock formats it with
# LUKS2: nothing is resized under an existing volume. Later boots find no free
# space behind the partition and change nothing.
#
# systemd-repart matches an existing partition to a definition by its GPT
# type UUID alone, the first partition of a type to the first definition of
# that type. The rootfs, verity and data partitions of the image all carry the
# generic Linux type, so a definition for that type would be matched to the
# first rootfs slot, which has no free space behind it, and /data would not
# grow at all. /data therefore has a type of its own, the version-5
# (SHA-1) UUID of the URL
#   https://github.com/Okan-wqm/suderra-os/gpt-partition-type/data
# in the URL namespace, which the production genimage layouts use for their
# data partition and tests/image-contracts/data-growth-contract-test.sh
# recomputes. No Discoverable Partitions Specification type is used: those are
# mounted by systemd-gpt-auto-generator.
#
# Only production images ship this file (post-build.sh deletes it elsewhere):
# a dev image has no partition of this type, and repart would create one in
# any free space.

[Partition]
Type=dfd38caa-c384-51a7-8a94-2446996318c5
Label=data
# The size genimage gave it is the minimum; it is never shrunk.
SizeMinBytes=64M
