[package]
name = "suderra-installer"
description = "Suderra OS root installer — edge agent delivery, signed site config, device lifecycle (ADR-048)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[[bin]]
name = "suderra-installer"
path = "src/main.rs"

[features]
# The apt-like package path (install/upgrade/rollback/list/status/remove,
# cosign keyless, GitHub mirrors) is dev-only and compiled out of every image
# build, which uses the default feature set (ADR-048 DEC-2.2 path 5, DEC-19).
default = []
package-commands = []

[dependencies]
suderra-config = { workspace = true }

# Async runtime + HTTP
tokio = { workspace = true }
reqwest = { workspace = true }

# Error handling + logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
base64 = { workspace = true }

# Crypto (SHA256 verify)
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }

# CLI + UX
clap = { workspace = true }
dialoguer = { workspace = true }

# Time (audit log timestamps)
chrono = { workspace = true }

# Filesystem
tempfile = { workspace = true }
nix = { workspace = true }

# Release artifacts (tar.gz, read entry by entry; never unpacked by path)
flate2 = { workspace = true }
tar = { workspace = true }

# Provisioning request nonce, temporary names
getrandom = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
