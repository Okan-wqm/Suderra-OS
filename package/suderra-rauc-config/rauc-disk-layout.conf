# RAUC writes a slot to the device its system.conf names, and system.conf names
# the links suderra-disk-layout makes (ADR-048 DEC-18.1). The links exist only
# once every partition of the layout has been proven to be carried once and to
# be on the disk under the verified root, so RAUC starts after that and not at
# all when the layout is refused.
[Unit]
Requires=suderra-disk-layout.service
After=suderra-disk-layout.service
